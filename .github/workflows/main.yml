name: Compile Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pyinstaller-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Build with PyInstaller
        run: |
          uv run python -c "import sys; sys.setrecursionlimit(5000); from PyInstaller.__main__ import run; run(['--noconfirm', '--clean', '--windowed', '--name=sp', '--icon=videotrans/styles/icon.ico', '--add-data=videotrans;videotrans', 'sp.py'])"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp1.5
          path: dist/sp/

